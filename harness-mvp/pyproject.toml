[project]
name = "harness_mvp"
version = "0.1.0"
description = "MVP AI CLI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.18.0",
    "pydantic>=2.0",
    "prompt-toolkit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
